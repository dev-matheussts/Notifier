name: Steam Notifier
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Teste: enviar o último post de cada jogo para o Discord"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node steam-notifier.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TESTE: ${{ inputs.teste }}
      - name: Salvar estado
        run: |
          git config user.name "steam-bot"
          git config user.email "steam-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "atualiza seen" && git push)
